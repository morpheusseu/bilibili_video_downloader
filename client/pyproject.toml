[project]
name = "bilibili-client"
version = "0.1.0"
description = "Headless Bilibili session, acquisition and Broadcast client"
requires-python = ">=3.11"
dependencies = [
    "bpi-py==0.3.1",
    "httpx==0.28.1",
    "websockets==15.0.1",
    "playwright>=1.50,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bilibili_client"]
