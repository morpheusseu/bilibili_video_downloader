[project]
name = "bilibili-video-downloader"
version = "0.1.0"
description = "A desktop Bilibili video/audio downloader powered by bpi-py"
requires-python = ">=3.11"
dependencies = [
    "bpi-py==0.3.1",
    "httpx==0.28.1",
    "websockets==15.0.1",
    "PyQt5==5.15.11",
    "playwright>=1.50,<2",
    "imageio-ffmpeg==0.6.0",
]

[project.scripts]
bili-download = "bili_downloader.cli:main"
bili-downloader = "bili_downloader.gui:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.14,<0.15"]
build = ["pyinstaller>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bili_downloader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
